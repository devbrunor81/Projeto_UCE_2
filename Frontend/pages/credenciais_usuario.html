<link rel="stylesheet" href="../css/items.css">

<div class="login-container">
   <div class="login-card">
      <h2>Atualizar credenciais</h2>

        <form id="CredenciaisForm">

        <div class="form-group">
            <label for="senhaAtual">Senha atual</label>
            <input type="password" id="senhaAtual" required>
        </div>

        <div class="form-group">
            <label for="novaSenha">Nova senha</label>
            <input type="password" id="novaSenha">
        </div>

        <div class="form-group">
            <label for="confirmarNovaSenha">Confirmar nova senha</label>
            <input type="password" id="confirmarNovaSenha">
        </div>

        <div class="form-actions">
            <button class="primary-btn" type="submit">Cadastrar</button>
            <button type="button" class="secondary-btn" onclick="history.back()">Cancelar</button>
        </div>

        </form>
   </div>
</div>
